<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap");

    * {
      font-family: "Kantumruy Pro", sans-serif;
    }
  </style>

  <body class="bg-gray-700 min-h-screen">
    <header
      class="bg-gray-100 w-full min-h-20 items-center flex px-16 justify-between"
    >
      <!-- logo -->
      <div class="logo flex">
        <h1 class="text-2xl font-extrabold">
          Shop<span class="text-blue-600">Ease</span>
        </h1>
      </div>
      <!-- search -->
      <div class="relative">
        <input
          class="py-3 border w-[990px] pl-5 rounded-md"
          type="search"
          placeholder="search for product,brand..."
        />
        <div
          class="py-[12.8px] px-8 rounded-r-md rounded-l-sm bg-blue-600 absolute right-0 top-0"
        >
          <i class="fa-solid fa-magnifying-glass text-white w-full"></i>
        </div>
      </div>
      <!-- icon -->
      <div class="icon text-2xl space-x-3">
        <i class="fa-regular fa-heart"></i>
        <i class="fa-solid fa-cart-shopping"></i>
        <i class="fa-regular fa-user"></i>
      </div>
    </header>

    <!-- benner cheak hok -->
    <section class="relative w-full mx-auto p-3">
      <!-- Banner Image -->
      <img
        src="https://i.pinimg.com/1200x/4f/42/a5/4f42a51a57226d88fcc555ded18d25a5.jpg"
        alt="Banner"
        class="w-full rounded-2xl"
      />

      <!-- Content -->
      <div
        class="absolute left-10 top-1/2 -translate-y-1/2 xl:top-1/3 lg:left-1/2 lg:-translate-x-1/2 lg:text-center"
      >
        <!-- Main title -->
        <h3
          class="text-3xl font-bold leading-tight sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl 2xl:text-8xl"
        >
          Shop Smart.<br />
          Live Better.
        </h3>
        <!-- Paragraph -->
        <p
          class="mt-4 text-gray-800 max-w-[70%] sm:text-xl lg:text-2xl lg:max-w-full"
        >
          Discover quality products at the best prices.
        </p>
        <!-- BTN -->
        <button
          class="mt-6 bg-blue-600 text-white px-4 py-2 rounded-lg sm:px-6 sm:py-3"
        >
          Shop Now →
        </button>
      </div>
    </section>
    <!-- end of benner -->
    <section>
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold">Shop by Category</h2>
        <a href="#" class="text-sm text-blue-600 font-medium hover:underline"
          >View All &rarr;</a
        >
      </div>
      <div class="grid grid-cols-3 sm:grid-cols-6 gap-4 text-center">
        <div
          class="bg-white p-4 rounded-xl border border-gray-100 hover:shadow-md cursor-pointer transition"
        >
          <div
            class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-2 text-blue-600"
          >
            <i data-lucide="smartphone" class="w-6 h-6"></i>
          </div>
          <span class="text-xs font-medium">Electronics</span>
        </div>
        <div
          class="bg-white p-4 rounded-xl border border-gray-100 hover:shadow-md cursor-pointer transition"
        >
          <div
            class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-2 text-blue-600"
          >
            <i data-lucide="shirt" class="w-6 h-6"></i>
          </div>
          <span class="text-xs font-medium">Fashion</span>
        </div>
        <div
          class="bg-white p-4 rounded-xl border border-gray-100 hover:shadow-md cursor-pointer transition"
        >
          <div
            class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-2 text-blue-600"
          >
            <i data-lucide="home" class="w-6 h-6"></i>
          </div>
          <span class="text-xs font-medium">Home & Kitchen</span>
        </div>
        <div
          class="bg-white p-4 rounded-xl border border-gray-100 hover:shadow-md cursor-pointer transition"
        >
          <div
            class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-2 text-blue-600"
          >
            <i data-lucide="sparkles" class="w-6 h-6"></i>
          </div>
          <span class="text-xs font-medium">Beauty</span>
        </div>
        <div
          class="bg-white p-4 rounded-xl border border-gray-100 hover:shadow-md cursor-pointer transition"
        >
          <div
            class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-2 text-blue-600"
          >
            <i data-lucide="activity" class="w-6 h-6"></i>
          </div>
          <span class="text-xs font-medium">Sports</span>
        </div>
        <div
          class="bg-white p-4 rounded-xl border border-gray-100 hover:shadow-md cursor-pointer transition"
        >
          <div
            class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-2 text-blue-600"
          >
            <i data-lucide="more-horizontal" class="w-6 h-6"></i>
          </div>
          <span class="text-xs font-medium">More</span>
        </div>
      </div>
    </section>
    <!-- icon sidath -->
    <section></section>
    <!-- end of icon -->

    <!-- category srey mean -->
    <section></section>
    <!-- end of category -->

    <!-- popular product chantha -->
    <section></section>
    <!-- end of popular product -->

    <!-- benner chandeth -->
    <section>
      <h1>hello</h1>
    </section>
    <!-- end of benner  -->

    <!-- New Arrival visal -->
    <section></section>
    <!-- end of New Arrival -->

    <!-- incon panith -->
    <section></section>
    <!-- end of icon -->

    <!-- footer sarin-->
    <section></section>
    <!-- end of footer -->
  </body>
</html>
