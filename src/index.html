    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promo Banner</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://jsdelivr.net" rel="stylesheet">
  <!-- Bootstrap Icons (for the arrow) -->
  <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container">
    <!-- Banner Wrapper -->
    <div class="row align-items-center rounded-4 p-4 p-md-5 text-white" 
         style="background-color: #0d6efd; background-image: radial-gradient(circle at 60% 50%, #157bfb, #0a58ca); overflow: hidden;">
      
      <!-- Left Content Column -->
      <div class="col-md-7 text-center text-md-start mb-4 mb-md-0">
        <h1 class="fw-bold mb-2 text-nowrap" style="font-size: calc(1.5rem + 1.5vw);">
          Big Deals. Bigger Savings.
        </h1>
        <p class="fs-5 opacity-75 mb-4">
          Up to 50% off on top products
        </p>
        <a href="#" class="btn btn-warning fw-semibold px-4 py-2 rounded-3 text-dark transition-all" 
           style="background-color: #ffc107; border: none;">
          Explore Deals <i class="bi bi-arrow-right ms-2"></i>
        </a>
      </div>
      
      <!-- Right Image/Illustration Column -->
      <div class="col-md-5 d-flex justify-content-center justify-content-md-end position-relative">
        <!-- SVG shopping bags for a clean, code-only look matching the image -->
        <svg xmlns="http://w3.org" viewBox="0 0 400 250" class="img-fluid" style="max-height: 180px;">
          <!-- Small right bag -->
          <g transform="translate(280, 110)">
            <path d="M20,40 C20,10 60,10 60,40" fill="none" stroke="#664d03" stroke-width="4"/>
            <path d="M0,40 L80,40 L75,130 L5,130 Z" fill="#ffb703"/>
          </g>
          <!-- Big back bag -->
          <g transform="translate(140, 30)">
            <path d="M40,50 C40,10 120,10 120,50" fill="none" stroke="#664d03" stroke-width="5"/>
            <path d="M0,50 L160,50 L150,210 L10,210 Z" fill="#ffb703" opacity="0.9"/>
          </g>
          <!-- Front left bag -->
          <g transform="translate(50, 70)">
            <path d="M35,45 C35,10 95,10 95,45" fill="none" stroke="#4d3802" stroke-width="5"/>
            <path d="M0,45 L130,45 L120,170 L10,170 Z" fill="#ffc107"/>
          </g>
        </svg>
      </div>

    </div>
  </div>

</body>
</html>
